<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Не Сьогодні 3.0 — прогрес (embed)</title>
<style>html,body{margin:0;height:100%;background:#dcd9c6}</style>
<!-- Embed-версія: той самий дашборд у режимі ?embed=1 (без банера і футера).
     Тримайте цей файл поряд із index.html. Вставляється на сайт через <iframe>. -->
<script>
  location.replace("index.html?embed=1" + location.hash);
</script>
</head>
<body>
<noscript>
  <p style="font-family:sans-serif;padding:20px">
    Увімкніть JavaScript або відкрийте <a href="index.html?embed=1">index.html?embed=1</a>.
  </p>
</noscript>
</body>
</html>
